# Configuration minimale pour la CLI Supabase (développement local / db push).
# Les secrets ne vont JAMAIS ici. Voir DEPLOYMENT.md.
project_id = "dada-beauty"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/connexion/confirmer"]
# Pas d'inscription publique : les comptes sont créés par invitation.
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "8MiB"
