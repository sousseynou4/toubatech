# Configuration minimale pour la CLI Supabase (développement local / db push).
# Les secrets ne vont JAMAIS ici. Voir DEPLOYMENT.md.
project_id = "dada-beauty"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/connexion/confirmer"]
# Pas d'inscription publique : les comptes sont créés par invitation.
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

# Emails en français (mêmes modèles que sur le projet Supabase en ligne : Authentication → Emails).
[auth.email.template.invite]
subject = "Votre accès à l'espace équipe Dada Beauty"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe Dada Beauty"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "8MiB"
